# Builds IdleonAutomator.exe from a clean checkout on a Windows runner, and
# optionally has SignPath sign it.
#
# WHY THIS EXISTS
# ---------------
# A release built on a laptop is a release only one person can reproduce, and
# nobody else can check what went into it. Building here means the exe is
# traceable to a public commit, produced by a machine with no local state --
# which is also the prerequisite for code signing: a signing service attests
# that a binary came from a specific commit through a pipeline nobody
# hand-touched, and it cannot attest that about a file uploaded from a desktop.
#
# THE ORDER MATTERS
# -----------------
#     build  ->  sign  ->  hash  ->  publish
#
# Signing appends to the executable and changes its bytes, so version.json must
# be written AFTER signing or it describes a file nobody will ever download.
# That is why the unsigned upload carries the exe ALONE: SignPath's artifact
# configuration expects a zip containing exactly IdleonAutomator.exe, and a
# manifest generated before signing would be wrong anyway.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Submit the build to SignPath for signing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # SignPath uses OIDC to verify the workflow's identity

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Catches an import error or a missing data file in seconds, before
      # spending two minutes on PyInstaller only to find out the same thing.
      - name: Import check
        working-directory: app
        run: |
          python -c "import core.update, core.worlds, core.tasklists; print('core OK')"
          python -c "import tools.release_audit, tools.make_manifest, tools.check_release; print('tools OK')"

      - name: Build
        working-directory: app
        run: python tools/build_exe.py

      # The exe ALONE, so the zip GitHub produces matches the artifact
      # configuration exactly: <zip-file><pe-file path="IdleonAutomator.exe">.
      # Anything else in here makes the zip not match and the request fail.
      - name: Upload unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: IdleonAutomator-unsigned
          path: dist/IdleonAutomator.exe
          if-no-files-found: error
          retention-days: 7

      # ---- signing, on request only -----------------------------------
      # Not on every push: signing requests are a finite resource on a free
      # tier, and an unsigned build is still a perfectly good check that the
      # code compiles. Run this workflow by hand with "sign" ticked, or push a
      # v* tag, when you actually want a signed binary.
      # Reports whether the secret arrived, WITHOUT revealing it. GitHub masks
      # secret values in logs, but a length is safe and is the one fact that
      # separates "the secret is missing or misnamed" from "the token itself is
      # being refused" -- two failures that look identical from the outside.
      - name: Check the API token reached the runner
        if: inputs.sign || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOKEN)) {
            "SIGNPATH_API_TOKEN is EMPTY."
            "  The secret is missing, misnamed, or was added somewhere other"
            "  than repository secrets. It must be named exactly"
            "  SIGNPATH_API_TOKEN under Settings > Secrets and variables >"
            "  Actions > Repository secrets."
            exit 1
          }
          "SIGNPATH_API_TOKEN present, length $($env:TOKEN.Length) characters."
          if ($env:TOKEN -match '\s') {
            "  WARNING: it contains whitespace -- likely a copy/paste artefact."
          }

      - name: Submit to SignPath
        if: inputs.sign || startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'abf18e59-6fa4-4beb-b124-1fd46fd1264f'
          project-slug: 'automater-bot'
          signing-policy-slug: 'Test_signing'
          github-artifact-id: '${{ steps.unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      # dist/ holds what gets shipped, so the signed binary replaces the
      # unsigned one there -- and make_manifest.py then hashes the file that
      # will actually be published.
      - name: Use the signed exe
        if: inputs.sign || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter IdleonAutomator.exe |
                    Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no IdleonAutomator.exe" }
          Copy-Item $signed.FullName dist/IdleonAutomator.exe -Force
          "replaced dist/IdleonAutomator.exe with the signed build"

      # Runs in both cases. On an unsigned build it reports "signature: NONE",
      # which is the honest answer rather than a silent omission.
      - name: Write manifest
        working-directory: app
        run: python tools/make_manifest.py

      - name: Report
        shell: pwsh
        run: |
          $exe = Get-Item dist/IdleonAutomator.exe
          "exe    : {0:N1} MB" -f ($exe.Length / 1MB)
          "sha256 : " + (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sig = Get-AuthenticodeSignature $exe.FullName
          "signed : $($sig.Status)  $($sig.SignerCertificate.Subject)"
          Get-Content dist/version.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: IdleonAutomator
          path: |
            dist/IdleonAutomator.exe
            dist/version.json
          if-no-files-found: error
          retention-days: 30
