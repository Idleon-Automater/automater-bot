# Builds IdleonAutomator.exe from a clean checkout on a Windows runner, and
# optionally has SignPath sign it.
#
# WHY THIS EXISTS
# ---------------
# A release built on a laptop is a release only one person can reproduce, and
# nobody else can check what went into it. Building here means the exe is
# traceable to a public commit, produced by a machine with no local state.
#
# WHY THE POWERSHELL MODULE AND NOT THE GITHUB ACTIONS CONNECTOR
# --------------------------------------------------------------
# The connector (signpath/github-action-submit-signing-request) answered every
# request with 400 "Could not authorize against SignPath API", while the very
# same token returned 200 against the REST API and a manual submit through the
# web UI signed successfully. SignPath's own CI Integration tab for this policy
# documents the PowerShell module rather than the connector -- so this uses the
# route they point at, which is also the route already proven to work here.
#
# The trade-off: the connector additionally performs ORIGIN VERIFICATION, tying
# a signature to a specific commit and workflow run. This does not. That is
# acceptable for a test certificate, and is worth revisiting for release
# signing, when the extra assurance is the whole point.
#
# THE ORDER MATTERS
# -----------------
#     build  ->  sign  ->  hash  ->  publish
#
# Signing rewrites the executable, so version.json must be written AFTER it or
# it describes a file nobody will ever download. Measured on a real request:
# the artifact hash changed from 80a893a1... to 6421e1f6... through signing.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Submit the build to SignPath for signing'
        type: boolean
        default: false
      notes:
        description: 'Release notes - what users are told changed'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Catches an import error or a missing data file in seconds, before
      # spending two minutes on PyInstaller only to find out the same thing.
      - name: Import check
        working-directory: app
        run: |
          python -c "import core.update, core.worlds, core.tasklists; print('core OK')"
          python -c "import tools.release_audit, tools.make_manifest, tools.check_release; print('tools OK')"

      - name: Build
        working-directory: app
        run: python tools/build_exe.py

      # ---- signing, on request only -----------------------------------
      # Not on every push: signing requests are a finite resource and an
      # unsigned build still proves the code compiles. Run this workflow by
      # hand with "sign" ticked, or push a v* tag.
      - name: Sign with SignPath
        if: inputs.sign || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            throw "SIGNPATH_API_TOKEN is empty - check the repository secret."
          }

          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force -Scope CurrentUser
          Import-Module SignPath

          # The artifact configuration declares <zip-file><pe-file
          # path="IdleonAutomator.exe">, so the exe must be submitted zipped,
          # at the root of the archive and on its own.
          Compress-Archive -Path dist/IdleonAutomator.exe `
                           -DestinationPath signing-input.zip -Force

          Submit-SigningRequest `
            -InputArtifactPath  signing-input.zip `
            -ApiToken           $env:SIGNPATH_API_TOKEN `
            -OrganizationId     'abf18e59-6fa4-4beb-b124-1fd46fd1264f' `
            -ProjectSlug        'automater-bot' `
            -SigningPolicySlug  'Test_signing' `
            -OutputArtifactPath signed.zip `
            -WaitForCompletion

          Expand-Archive signed.zip -DestinationPath signed -Force
          $exe = Get-ChildItem signed -Recurse -Filter IdleonAutomator.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "SignPath returned no IdleonAutomator.exe" }

          # dist/ holds what gets shipped, so the signed binary replaces the
          # unsigned one and make_manifest.py hashes what will be published.
          Copy-Item $exe.FullName dist/IdleonAutomator.exe -Force
          "replaced dist/IdleonAutomator.exe with the signed build"

      # Runs in both cases. On an unsigned build it reports "signature: NONE",
      # which is the honest answer rather than a silent omission.
      # Notes travel by environment variable, for two reasons. ${{ }} is
      # substituted before the shell sees it, so a quote or a semicolon typed
      # into the form would otherwise execute as script. And PowerShell drops
      # an empty string argument entirely, so passing --notes "" on an ordinary
      # push would reach argparse as a bare --notes and fail the build.
      - name: Write manifest
        working-directory: app
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python tools/make_manifest.py

      - name: Report
        shell: pwsh
        run: |
          $exe = Get-Item dist/IdleonAutomator.exe
          "exe    : {0:N1} MB" -f ($exe.Length / 1MB)
          "sha256 : " + (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sig = Get-AuthenticodeSignature $exe.FullName
          "status : $($sig.Status)"
          if ($sig.SignerCertificate) { "signer : $($sig.SignerCertificate.Subject)" }
          Get-Content dist/version.json

      - uses: actions/upload-artifact@v7
        with:
          name: IdleonAutomator
          path: |
            dist/IdleonAutomator.exe
            dist/version.json
          if-no-files-found: error
          retention-days: 30
